name: Github wiki sync repository action
description: Create / Generate / Update Github wiki based on your repository documentation
branding:
  icon: book-open
  color: green

inputs:
  dir:
    required: true
    default: "docs/"
    description: "Directory of documentation which will be used to Github wiki"

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
      shell: bash

    - name: Clone Wiki Repository
      id: clone_wiki
      run: |
        if git clone "https://x-access-token:${{ env.GITHUB_TOKEN || github.token }}@github.com/${{ github.repository }}.wiki.git" ./wiki; then
          echo "wiki_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "wiki_exists=false" >> "$GITHUB_OUTPUT"
          echo "Wiki repository not found. Skipping wiki sync."
          echo "If this is your first run, initialize wiki at https://github.com/${{ github.repository }}/wiki/_new"
        fi
      shell: bash

    - name: Sync Docs to Wiki
      if: steps.clone_wiki.outputs.wiki_exists == 'true'
      run: |
        if [ ! -d "./${{ inputs.dir }}" ]; then
          echo "Directory ${{ inputs.dir }} does not exist. Creating it."
          mkdir -p "${{ inputs.dir }}"
        fi
        cp -R "${{ inputs.dir }}" wiki/
      shell: bash

    - name: Commit and Push Wiki changes
      if: steps.clone_wiki.outputs.wiki_exists == 'true'
      run: |
        cd wiki
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "[Update] Wiki from repository docs"
          git push origin master
        fi
      shell: bash

    - name: Cleanup
      if: steps.clone_wiki.outputs.wiki_exists == 'true'
      run: |
        rm -rf wiki/
      shell: bash
